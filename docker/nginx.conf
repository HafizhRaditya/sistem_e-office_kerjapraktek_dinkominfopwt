# E-Office Banyumas — Nginx front end.
#
# Serves everything under public/ directly and hands .php to PHP-FPM in the
# `app` container over the compose network. The document root is public/, never
# the project root: anything above it (.env, storage/, vendor/, app/) must not
# be reachable over HTTP.
#
# NOT TESTED YET — written without Docker available. Verify with a real
# `docker compose up` before this fronts anything real.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # public/ ONLY. This single line is what keeps .env and storage/ off the web.
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Must be at least as large as PHP's post_max_size (12M, set in the
    # Dockerfile), or Nginx rejects a big banner upload with a bare 413 before
    # PHP ever sees it and can explain the real limit.
    client_max_body_size 12M;

    # The portal sits behind this server; TLS is terminated here or at an
    # upstream proxy. Laravel is told about the original scheme through
    # X-Forwarded-Proto below, which is what TrustProxies reads.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Laravel's health endpoint (registered in bootstrap/app.php as /up).
    # Kept out of the access log so a monitor polling it does not drown the log.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Built assets are content-hashed by Vite, so they can be cached hard.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded banners, application icons and questionnaire images. This path is
    # the public/storage symlink into storage/app/public, which is a shared
    # volume. Never routed to PHP: whatever an admin uploaded is served as a
    # static file, and a .php file that somehow landed there must not execute.
    location /storage/ {
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # `app` is the compose service name; Docker's embedded DNS resolves it.
        # NOT 127.0.0.1 — that would be this Nginx container itself.
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        # SCRIPT_FILENAME is resolved inside the PHP-FPM container, so this path
        # is the app image's layout, not this container's.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Tell Laravel the scheme the browser actually used. Combined with
        # TRUSTED_PROXIES this is what stops route()/asset() emitting http://
        # links on an https:// site.
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Nothing else may reach PHP, and dotfiles stay invisible. The negative
    # lookahead keeps .well-known reachable, which ACME/Let's Encrypt needs.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
